shellEmulator: true
autoInstallPeers: false

trustPolicy: no-downgrade

packages:
  - workers/*

# The site root is a workspace project too, so `pnpm pipeline` can run its
# tasks. Every task that names no inputs hashes every tracked file, which is
# why lint carries no inputs: `eslint .` reads the whole repository. The
# narrowed inputs below exclude only trees those tasks never read, so a
# docs-only push leaves typecheck and test as cache hits. `scripts/**` and
# `checks/**` count even where a task does not read them today: suites import
# both, and the generated tsconfig that sets typecheck's reach can drift.
#
# The artifact-signer worker's suite is `test:worker`, outside the `test`
# pipeline on purpose. Its transform reaches files above the worker directory,
# whose tsconfig chain resolves through the root `.nuxt`, and a task in one
# project cannot wait on another project's `dev:prepare` without a dependency
# edge between them.
includeWorkspaceRoot: true
tasks:
  dev:prepare:
    dependsOn: []
    inputs:
      - nuxt.config.ts
      - app/**
      - modules/**
      - layers/**
      - server/**
      - shared/**
      - workers/**
      - package.json
      - pnpm-workspace.yaml
      - tsconfig.json
    outputs: ['.nuxt/**']
  lint:
    dependsOn: []
    outputs: []
  test:
    dependsOn: [dev:prepare]
    inputs:
      - app/**
      - server/**
      - shared/**
      - workers/**
      - modules/**
      - layers/**
      - test/**
      - scripts/**
      - checks/**
      - skills/**
      - migrations/**
      - schema.sql
      - vitest.config.ts
      - nuxt.config.ts
      - tsconfig.json
      - .dev.vars.example
      - package.json
      - pnpm-workspace.yaml
    outputs: []
  typecheck:
    dependsOn: [dev:prepare]
    env: [NODE_OPTIONS]
    inputs:
      - app/**
      - server/**
      - shared/**
      - workers/**
      - modules/**
      - layers/**
      - test/**
      - scripts/**
      - checks/**
      - '*.ts'
      - '*.jsonc'
      - '*.toml'
      - tsconfig.json
      - .dev.vars.example
      - package.json
      - pnpm-workspace.yaml
    outputs: []
pipelines:
  lint: [lint]
  test: [dev:prepare, test]

  typecheck: [dev:prepare, typecheck]
