name: Test

# The pull request gate. The three jobs carried three copies of the same four
# setup steps; they now come from harlan-zw/harlan-nuxt so every site shares one
# pinned copy.
#
# Pull request builds run separately from typechecks. Main reuses the deploy build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# All checks run on GitHub-hosted runners. Forks can change workflow files,
# so a workflow condition cannot protect a registered workstation runner.

jobs:
  harness-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@575a348edd78a65c6b28104a86d6a3401301c913
      - run: |
          pnpm --filter @skilld/skill-harness-worker types:check
          pnpm --filter @skilld/skill-harness-worker typecheck
          pnpm --filter @skilld/skill-harness-worker test:run

  site:
    uses: harlan-zw/harlan-nuxt/.github/workflows/harlan-desktop-site-ci.yml@575a348edd78a65c6b28104a86d6a3401301c913
    with:
      runs-on: '["ubuntu-latest"]'
      # Hosted runners have no workstation task cache. Prepare Nuxt before
      # typecheck and tests through the reusable workflow's direct commands.
      task-cache: false
      prepare-command: pnpm dev:prepare
      timeout-minutes: 30

  # The only gate between a merge and production. `Deploy to Cloudflare` fires on
  # this workflow's success for main, so a failure here stops the deploy.
  #
  # The main push runs it, pull requests do not: a site change cannot add a
  # command to the published CLI, so gating every pull request on the CLI
  # release would just hold unrelated work. The check clears itself once npm
  # `latest` carries the printed grammar. To deploy before then, run
  # `Deploy to Cloudflare` by hand.
  published-cli-grammar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@575a348edd78a65c6b28104a86d6a3401301c913
      - run: pnpm cli:grammar

  build:
    # Main builds in the deploy workflow. Keep the build check on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@575a348edd78a65c6b28104a86d6a3401301c913
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
