name: Test

# The pull request gate. The three jobs carried three copies of the same four
# setup steps; they now come from harlan-zw/harlan-nuxt so every site shares one
# pinned copy.
#
# The build and its Nuxt DX size budget moved out of the typecheck job into their
# own job below. Pinning them to typecheck meant a type error and a bundle
# regression could not be seen in the same run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: harlan-zw/harlan-nuxt/.github/workflows/nuxt-site-ci.yml@main
    with:
      # Ephemeral containers on the workstation. Safe here because the
      # repository is private; a self-hosted runner on a public repository would
      # let a fork pull request run code on that host.
      runs-on: '["self-hosted", "linux", "x64", "harlan-ci"]'
      timeout-minutes: 30

  # Kept in this repository because the size budget needs `actions: read` and the
  # artifact from this workflow's own last green run on the base branch, neither
  # of which the shared gate models.
  build:
    runs-on: [self-hosted, linux, x64, harlan-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: harlan-zw/harlan-nuxt/.github/actions/setup@main
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@main
        with:
          artifact-name: nuxt-dx-size-budget-v3
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
