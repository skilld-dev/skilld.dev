name: Publish skilld-sdk

# Push a `sdk-v<version>` tag on main to publish packages/sdk to npm.
#
# npm trusts this workflow file in the `npm-production` environment as the
# publisher of `skilld-sdk` (`npm trust list skilld-sdk`). No npm token exists.
# The repository is private, so npm records no provenance for these releases.

on:
  push:
    tags:
      - 'sdk-v*'

concurrency:
  group: publish-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, harlan-desktop-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main

      - name: Require the tag to match the package and sit on main
        run: |
          test "${GITHUB_REF_NAME#sdk-v}" = "$(node -p "require('./packages/sdk/package.json').version")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test, typecheck, and check the committed OpenAPI document
        run: |
          pnpm --filter skilld-sdk test
          pnpm --filter skilld-sdk typecheck

      - name: Build and pack
        run: |
          pnpm --filter skilld-sdk build
          mkdir release-artifacts
          pnpm --config.ignore-scripts=true --dir packages/sdk pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      - name: Prove the tarball imports and calls the contract
        run: |
          smoke_dir="$(mktemp -d)"
          echo '{"type":"module"}' >"$smoke_dir/package.json"
          npm install --prefix "$smoke_dir" --no-audit --no-fund release-artifacts/skilld-sdk-*.tgz
          cd "$smoke_dir"
          node --input-type=module -e "
            import { createSkilldClient, skilldV1Protocol } from 'skilld-sdk'
            import document from 'skilld-sdk/openapi.json' with { type: 'json' }
            const operations = Object.values(skilldV1Protocol.registries).flatMap(registry => Object.values(registry.operations))
            if (Object.keys(document.paths).length === 0 || operations.length === 0)
              throw new Error('empty contract')
            const result = await createSkilldClient({ fetch: async () => new Response('{\"items\":[],\"total\":0}') }).skills.search({ query: { q: 'smoke' } })
            if (result._tag !== 'Ok')
              throw new Error(JSON.stringify(result))
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skilld-sdk-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    # npm trusted publishing accepts OIDC tokens from GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the verified tarball and inline shell run with publish authority:
      # no checkout, no install, no lifecycle script.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skilld-sdk-${{ github.ref_name }}
          path: release-artifacts
      - name: Require npm 11.5.1 or newer, the first with trusted publishing
        run: node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish release-artifacts/skilld-sdk-"$version".tgz --access public --tag "$tag"
