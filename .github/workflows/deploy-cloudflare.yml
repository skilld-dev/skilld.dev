name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [site, harness-proof]
        default: site
      rotate_registry_github_token:
        description: Rotate the registry GitHub fallback token
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Every Test run that completes starts this workflow, including pull request
  # runs and cancelled main runs. Their deploy job skips, but a run in the
  # deploy group still replaces the run waiting there. On 2026-10-07 a pull
  # request's run cancelled the queued deploy of #526, so main stayed
  # undeployed. Only a successful main push can deploy, so every other run
  # takes a group of its own.
  group: >-
    ${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.conclusion != 'success'))
    && format('deploy-cloudflare-noop-{0}', github.run_id)
    || format('deploy-cloudflare-{0}', inputs.target || 'site') }}
  # A deploy in flight must finish. This workflow applies D1 migrations and then
  # deploys the signer and public Worker, then runs smoke and rollback. Cancelling
  # between those steps leaves migrated data against the previous Worker.
  cancel-in-progress: false

jobs:
  deploy:
    # `head_sha == github.sha` was dropped. For a `workflow_run` event
    # `github.sha` is the default branch tip at dispatch time, not the commit the
    # run covered, so the comparison silently skipped the deploy whenever main
    # advanced while Test was still running, and passed only by coincidence
    # otherwise. `head_sha` alone is the commit that was tested, and it is what
    # the checkout below already uses.
    #
    # `head_branch` alone is not proof of main. A fork's pull request from a
    # branch named `main` reports `head_branch == 'main'`, and its Test run
    # concludes `success` because every job skips fork code. Only a push to
    # this repository may deploy, or that fork's code would build with these
    # secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target != 'harness-proof') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@575a348edd78a65c6b28104a86d6a3401301c913
        with:
          install-args: ''

      # Persists + accumulates prior deploys' client chunks across builds so old
      # browser sessions still resolve their old _nuxt chunks during a rollout
      # (nuxt-skew-protection, fs storage). Keyed on the SHA so every build saves
      # a fresh entry; the prefix restore-key restores the previous accumulated
      # set. Mirrors nuxtseo.com/apps/site.
      - name: Cache skew-protection assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-prod-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            nuxt-skew-prod-

      - name: Build
        run: pnpm build
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_AI_READY_RUNTIME_SYNC_SECRET }}
          # Enables Sentry source-map upload + release injection so client errors
          # are un-minified and tagged with a release (fixes release: None on SKILLD-1).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm db:migrations:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rotate registry GitHub fallback token
        if: github.event_name == 'workflow_dispatch' && inputs.rotate_registry_github_token
        run: |
          if [ -z "$REGISTRY_GITHUB_TOKEN" ]; then
            echo 'If the replacement token is missing, set REGISTRY_GITHUB_TOKEN.' >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $REGISTRY_GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user \
            --output "$RUNNER_TEMP/registry-token-owner.json"
          printf '%s' "$REGISTRY_GITHUB_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN --config wrangler.jsonc
        env:
          REGISTRY_GITHUB_TOKEN: ${{ secrets.REGISTRY_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Retries a transient Cloudflare API fault, such as code 10013. Any other
      # failure stops the job at once.
      - name: Deploy Artifact signer
        run: pnpm production:deploy-signer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy, smoke, and rollback on failure
        run: pnpm production:deploy
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The page smoke above never touches the build queue. From 2026-08-21 to
      # 2026-09-01 every hosted Artifact build failed behind green deploys,
      # because workerd rejects a fetch redirect mode that Node accepts. This
      # step requests one public Resolution and fails the job unless the build
      # reaches `ready` within two minutes.
      - name: Smoke an Artifact build
        run: node scripts/smoke-artifact-resolution.mjs --timeout-ms 120000

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      # Workers Cache stores `/skills/trending` (see routeRules in
      # nuxt.config.ts). This proves a repeat visit is a hit, and that no stored
      # response sets a cookie, hides Markdown from an agent, or carries a
      # session. It fails the job without a rollback: the rollback smoke
      # re-checks the previous version, and a version from before the rule
      # could never pass these checks.
      - name: Check the trending edge cache
        run: pnpm production:edge-cache

  # The Harness Worker deploys on dispatch, and after a main push whose tested
  # commit changed it, its dependencies, or this workflow. It runs after the site deploy,
  # because the Worker calls site routes that the same merge may add. It skips
  # unchanged merges: a new version restarts containers, and a Skillgen job may
  # be running in one. The check diffs the tested commit against its first
  # parent, which covers a squash or merge commit, the only way main changes.
  harness-proof:
    needs: deploy
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.target == 'harness-proof') ||
      (needs.deploy.result == 'success' && github.event_name == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The live version's commit can be many merges back.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Compares the commit the live version was built from, not HEAD^. A merge
      # that cancels an earlier run would otherwise hide that run's Harness change.
      - name: Detect Harness changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            pnpm exec tsx scripts/harness-deploy-plan.ts
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the Harness Worker
        if: steps.changes.outputs.deploy == 'true'
        run: |
          pnpm --filter @skilld/skill-harness-worker types:check
          pnpm --filter @skilld/skill-harness-worker typecheck
          pnpm --filter @skilld/skill-harness-worker test:run
      - name: Deploy the Harness proof
        if: steps.changes.outputs.deploy == 'true'
        # The tag names the commit, so the next run diffs from what is live.
        run: pnpm --filter @skilld/skill-harness-worker deploy:proof --tag "${COMMIT:0:12}" --message "$COMMIT"
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
