name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      rotate_registry_github_token:
        description: Rotate the registry GitHub fallback token
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-site
  # A deploy in flight must finish. This workflow applies D1 migrations and then
  # deploys the signer and public Worker, then runs smoke and rollback. Cancelling
  # between those steps leaves migrated data against the previous Worker.
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Persists + accumulates prior deploys' client chunks across builds so old
      # browser sessions still resolve their old _nuxt chunks during a rollout
      # (nuxt-skew-protection storage). Keyed on the SHA so every build saves
      # a fresh entry; the prefix restore-key restores the previous accumulated
      # set. Mirrors nuxtseo.com/apps/site.
      - name: Cache skew-protection assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-prod-${{ github.sha }}
          restore-keys: |
            nuxt-skew-prod-

      - name: Build
        run: pnpm build
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_AI_READY_RUNTIME_SYNC_SECRET }}
          # Enables Sentry source-map upload + release injection so client errors
          # are un-minified and tagged with a release (fixes release: None on SKILLD-1).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Sentry deletes source maps only after it uploads them. Skew storage
      # restores earlier releases' maps into `.output/public`, so a build
      # without the token would serve them. Stop before production changes.
      - name: Refuse public source maps
        run: |
          maps=$(find .output/public -name '*.map')
          if [ -n "$maps" ]; then
            echo "::error::Source map files in .output/public: $(printf '%s\n' "$maps" | wc -l). Production would serve them."
            printf '%s\n' "$maps" | sed -n '1,5p'
            exit 1
          fi

      - name: Prepare the session secret
        run: |
          set -euo pipefail
          has_secret=$(pnpm exec wrangler secret list --config wrangler.jsonc --format json |
            jq -r 'if type == "array" then any(.[]; .name == "NUXT_APP_SECRET") else error("Expected Worker secret list") end')
          if [ "$has_secret" = true ]; then
            exit 0
          fi
          if [ "${#SKILLD_SESSION_ROOT}" -lt 32 ]; then
            echo 'Set NUXT_APP_SECRET to at least 32 characters.' >&2
            exit 1
          fi
          umask 077
          secret_file=$(mktemp "$RUNNER_TEMP/skilld-secrets.XXXXXXXX.json")
          jq -n '{NUXT_APP_SECRET: env.SKILLD_SESSION_ROOT}' > "$secret_file"
          printf 'SKILLD_DEPLOY_SECRETS_FILE=%s\n' "$secret_file" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKILLD_SESSION_ROOT: ${{ secrets.NUXT_APP_SECRET || secrets.NUXT_SESSION_PASSWORD }}

      - name: Apply D1 migrations
        run: pnpm db:migrations:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rotate registry GitHub fallback token
        if: github.event_name == 'workflow_dispatch' && inputs.rotate_registry_github_token
        run: |
          if [ -z "$REGISTRY_GITHUB_TOKEN" ]; then
            echo 'If the replacement token is missing, set REGISTRY_GITHUB_TOKEN.' >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $REGISTRY_GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user \
            --output "$RUNNER_TEMP/registry-token-owner.json"
          printf '%s' "$REGISTRY_GITHUB_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN --config wrangler.jsonc
        env:
          REGISTRY_GITHUB_TOKEN: ${{ secrets.REGISTRY_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Retries a transient Cloudflare API fault, such as code 10013. Any other
      # failure stops the job at once.
      - name: Deploy Artifact signer
        run: pnpm production:deploy-signer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy, smoke, and rollback on failure
        run: |
          trap 'if [ -n "${SKILLD_DEPLOY_SECRETS_FILE:-}" ]; then rm -f "$SKILLD_DEPLOY_SECRETS_FILE"; fi' EXIT
          pnpm production:deploy
        env:
          GITHUB_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The page smoke above never touches the build queue. From 2026-08-21 to
      # 2026-09-01 every hosted Artifact build failed behind green deploys,
      # because workerd rejects a fetch redirect mode that Node accepts. This
      # step requests one public Resolution and fails the job unless the build
      # reaches `ready` within two minutes.
      - name: Smoke an Artifact build
        run: node scripts/smoke-artifact-resolution.mjs --timeout-ms 120000

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"
