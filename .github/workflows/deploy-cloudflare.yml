name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [site, harness-proof]
        default: site

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-${{ inputs.target || 'site' }}
  # A deploy in flight must finish. This workflow applies D1 migrations and then
  # deploys the signer and public Worker, then runs smoke and rollback. Cancelling
  # between those steps leaves migrated data against the previous Worker.
  cancel-in-progress: false

jobs:
  deploy:
    # `head_sha == github.sha` was dropped. For a `workflow_run` event
    # `github.sha` is the default branch tip at dispatch time, not the commit the
    # run covered, so the comparison silently skipped the deploy whenever main
    # advanced while Test was still running, and passed only by coincidence
    # otherwise. `head_sha` alone is the commit that was tested, and it is what
    # the checkout below already uses.
    #
    # `head_branch` alone is not proof of main. A fork's pull request from a
    # branch named `main` reports `head_branch == 'main'`, and its Test run
    # concludes `success` because every job skips fork code. Only a push to
    # this repository may deploy, or that fork's code would build with these
    # secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target != 'harness-proof') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64, harlan-desktop-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main
        with:
          install-args: ''

      # Persists + accumulates prior deploys' client chunks across builds so old
      # browser sessions still resolve their old _nuxt chunks during a rollout
      # (nuxt-skew-protection, fs storage). Keyed on the SHA so every build saves
      # a fresh entry; the prefix restore-key restores the previous accumulated
      # set. Mirrors nuxtseo.com/apps/site.
      - name: Cache skew-protection assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-prod-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            nuxt-skew-prod-

      - name: Build
        run: pnpm build
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_AI_READY_RUNTIME_SYNC_SECRET }}
          # Enables Sentry source-map upload + release injection so client errors
          # are un-minified and tagged with a release (fixes release: None on SKILLD-1).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm db:migrations:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Artifact signer
        run: pnpm --filter @skilld/artifact-signer-worker deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy, smoke, and rollback on failure
        run: pnpm production:deploy
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The page smoke above never touches the build queue. From 2026-08-21 to
      # 2026-09-01 every hosted Artifact build failed behind green deploys,
      # because workerd rejects a fetch redirect mode that Node accepts. This
      # step requests one public Resolution and fails the job unless the build
      # reaches `ready` within two minutes.
      - name: Smoke an Artifact build
        run: node scripts/smoke-artifact-resolution.mjs --timeout-ms 120000

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      # Workers Cache stores `/skills/trending` (see routeRules in
      # nuxt.config.ts). This proves a repeat visit is a hit, and that no stored
      # response sets a cookie, hides Markdown from an agent, or carries a
      # session. It fails the job without a rollback: the rollback smoke
      # re-checks the previous version, and a version from before the rule
      # could never pass these checks.
      - name: Check the trending edge cache
        run: pnpm production:edge-cache

  harness-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'harness-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the Harness Worker
        run: |
          pnpm --filter @skilld/skill-harness-worker types:check
          pnpm --filter @skilld/skill-harness-worker typecheck
          pnpm --filter @skilld/skill-harness-worker test:run
      - name: Deploy the Harness proof
        run: pnpm --filter @skilld/skill-harness-worker deploy:proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
