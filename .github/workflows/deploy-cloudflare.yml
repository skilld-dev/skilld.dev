name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persists + accumulates prior deploys' client chunks across builds so old
      # browser sessions still resolve their old _nuxt chunks during a rollout
      # (nuxt-skew-protection, fs storage). Keyed on the SHA so every build saves
      # a fresh entry; the prefix restore-key restores the previous accumulated
      # set. Mirrors nuxtseo.com/apps/site.
      - name: Cache skew-protection assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-prod-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            nuxt-skew-prod-

      - name: Build
        run: pnpm build
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_AI_READY_RUNTIME_SYNC_SECRET }}
          # Enables Sentry source-map upload + release injection so client errors
          # are un-minified and tagged with a release (fixes release: None on SKILLD-1).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm db:migrations:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy, smoke, and rollback on failure
        run: pnpm production:deploy
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
