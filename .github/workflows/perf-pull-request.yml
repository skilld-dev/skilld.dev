name: Perf Pull Request

# Measures a pull request against its base, in one job, on one machine.
# It holds no write access and posts nothing. Perf Comment does that, from the
# artifact this job uploads.
# It is not a required check and it never blocks a merge.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    # Safe on the workstation pool because the repository is private; a fork
    # pull request cannot reach this runner.
    runs-on: [self-hosted, linux, x64, harlan-desktop-ci]
    timeout-minutes: 45
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs this revision only for the heartbeat wrapper. Each measured
      # side installs from its own lockfile below.
      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main

      # Both sides are exported from git into fresh directories. Nothing is
      # restored into them: a restored skew-protection cache would copy the
      # chunks of earlier deploys into the output and count them too.
      - name: Export both commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/head" "$RUNNER_TEMP/base"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/head"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/base"

      # The desktop runner sends SIGHUP after 45 seconds without output.
      # Nitro can bundle longer than that, so the wrapper emits a heartbeat.
      - name: Build the pull request
        working-directory: ${{ runner.temp }}/head
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm install --frozen-lockfile
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/run-with-heartbeat.ts" pnpm build

      - name: Build the base commit
        working-directory: ${{ runner.temp }}/base
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm install --frozen-lockfile
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/run-with-heartbeat.ts" pnpm build

      - name: Note whether the dependencies moved
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Each side installs from its own lockfile, so this does not affect
          # whether the comparison holds. It tells a reader where a delta may
          # have come from.
          if git diff --quiet "$BASE_SHA" HEAD -- pnpm-lock.yaml; then
            echo "dependencies_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "dependencies_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "label=$(git log -1 --format='%h · %cs' "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Measure both builds
        # Every value a pull request can influence arrives as an environment
        # variable. Nothing from the event is pasted into this script.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.dependencies_changed }}
        run: |
          node scripts/perf/run.mjs \
            --head "$RUNNER_TEMP/head" \
            --parent "$RUNNER_TEMP/base" \
            --commit "$HEAD_SHA" \
            --parent-commit "$BASE_SHA" \
            --dependencies-changed "$DEPENDENCIES_CHANGED" \
            --out "$RUNNER_TEMP/perf-report/measurement.json"

      - name: Write the report
        env:
          BASE_LABEL: ${{ github.base_ref }} @ ${{ steps.deps.outputs.label }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MEASUREMENT: ${{ runner.temp }}/perf-report/measurement.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_DIR: ${{ runner.temp }}/perf-report
        run: |
          set -euo pipefail
          node scripts/perf/report.mjs | tee "$REPORT_DIR/report.md"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$PR_NUMBER" > "$REPORT_DIR/pr-number.txt"
          printf '%s\n' "$HEAD_SHA" > "$REPORT_DIR/head-sha.txt"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report
          if-no-files-found: error
          retention-days: 14
