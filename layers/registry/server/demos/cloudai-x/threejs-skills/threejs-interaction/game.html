<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gullwick</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: "Trebuchet MS", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 16px; pointer-events: none; color: #fff; font-weight: bold; font-size: clamp(16px, 4vw, 24px); text-shadow: 0 2px 0 #1b4f72, 0 0 6px rgba(0,0,0,.3); }
  #hud .chips { color: #ffe066; }
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 50, 80, .45); }
  .panel.hidden { display: none; }
  .card { background: #fffaf0; border: 4px solid #d6453d; border-radius: 16px; padding: 24px 28px; max-width: 340px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .card h1 { margin: 0 0 6px; font-size: 42px; color: #d6453d; letter-spacing: 1px; }
  .card p { margin: 8px 0; line-height: 1.4; }
  .card .big { font-size: 22px; font-weight: bold; }
  button { margin-top: 12px; font: inherit; font-size: 20px; font-weight: bold; color: #fff; background: #2e86c1; border: 0; border-radius: 10px; padding: 10px 28px; cursor: pointer; box-shadow: 0 4px 0 #1b4f72; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1b4f72; }
</style>
</head>
<body>
<div id="hud">
  <span class="chips">🍟 <span id="chips">20</span></span>
  <span>Shooed: <span id="score">0</span></span>
  <span id="time">0.0s</span>
</div>

<div id="start" class="panel">
  <div class="card">
    <h1>Gullwick</h1>
    <p>The gulls are after your chips!</p>
    <p>Click or tap each seagull to shoo it before it reaches the stall. Big gulls take two taps.</p>
    <p>You've got <b>20 chips</b>. When they're gone, so is your stall.</p>
    <button id="startBtn">Open the stall</button>
  </div>
</div>

<div id="over" class="panel hidden">
  <div class="card">
    <h1>Picked clean!</h1>
    <p class="big">Shooed <span id="finalScore">0</span> gulls</p>
    <p>Held out for <span id="finalTime">0</span>s</p>
    <p id="best"></p>
    <button id="againBtn">Fry another batch</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const START_CHIPS = 20;

// ---------- Renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 25, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
const camTarget = new THREE.Vector3(0, 1.8, 0);
function fitCamera() {
  camera.aspect = window.innerWidth / window.innerHeight;
  // Pull back on narrow (portrait) screens so the whole stall and sky fit.
  const dist = camera.aspect < 1 ? 9 + (1 - camera.aspect) * 9 : 9;
  camera.position.set(0, 3.4, dist);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
fitCamera();

scene.add(new THREE.HemisphereLight(0xdff4ff, 0xe8c99a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);

// ---------- Seaside ----------
const sand = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0xf1d9a5 }));
sand.rotation.x = -Math.PI / 2;
sand.position.z = 6;
sand.receiveShadow = true;
scene.add(sand);

const seaMat = new THREE.MeshLambertMaterial({ color: 0x2f8fc4 });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 80, 60, 20), seaMat);
sea.rotation.x = -Math.PI / 2;
sea.position.set(0, 0.05, -54);
scene.add(sea);
const seaPos = sea.geometry.attributes.position;
const seaBase = Float32Array.from(seaPos.array);

// Promenade railing behind the stall
const railMat = new THREE.MeshLambertMaterial({ color: 0x2c6e8f });
for (let x = -20; x <= 20; x += 2) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1, 0.12), railMat);
  post.position.set(x, 0.5, -6);
  scene.add(post);
}
const rail = new THREE.Mesh(new THREE.BoxGeometry(42, 0.12, 0.12), railMat);
rail.position.set(0, 1, -6);
scene.add(rail);

// Clouds
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const clouds = [];
for (let i = 0; i < 6; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 4; j++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(1 + Math.random() * 0.8, 10, 8), cloudMat);
    puff.position.set(j * 1.3 - 2, Math.random() * 0.5, Math.random() * 0.5);
    c.add(puff);
  }
  c.position.set(-30 + i * 12, 11 + Math.random() * 4, -25 - Math.random() * 10);
  scene.add(c);
  clouds.push(c);
}

// ---------- Chip stall ----------
const stall = new THREE.Group();
scene.add(stall);

const woodMat = new THREE.MeshLambertMaterial({ color: 0x5dade2 });
const trimMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const counter = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.1, 1.6), woodMat);
counter.position.y = 0.55;
counter.castShadow = counter.receiveShadow = true;
stall.add(counter);
const top = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.1, 1.8), trimMat);
top.position.y = 1.15;
top.receiveShadow = true;
stall.add(top);

// Back wall with sign
const back = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 0.15), woodMat);
back.position.set(0, 1.3, -0.9);
stall.add(back);

function makeSignTexture() {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#fffaf0"; g.fillRect(0, 0, 512, 128);
  g.fillStyle = "#d6453d"; g.font = "bold 72px Trebuchet MS, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("GULLWICK CHIPS", 256, 68);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.9), new THREE.MeshBasicMaterial({ map: makeSignTexture() }));
sign.position.set(0, 2.15, -0.81);
stall.add(sign);

// Striped awning
function makeStripeTexture() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 8;
  const g = c.getContext("2d");
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#ffffff" : "#d6453d"; g.fillRect(i * 32, 0, 32, 8); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const awning = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.08, 1.2), new THREE.MeshLambertMaterial({ map: makeStripeTexture() }));
awning.position.set(0, 2.95, -0.35);
awning.rotation.x = 0.35;
awning.castShadow = true;
stall.add(awning);

// Chip tray + chips
const trayMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const tray = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.12, 0.9), trayMat);
tray.position.set(0, 1.26, 0.2);
tray.castShadow = true;
stall.add(tray);
const trayTarget = new THREE.Vector3(0, 1.5, 0.2);

const chipGeo = new THREE.BoxGeometry(0.07, 0.07, 0.42);
const chipMat = new THREE.MeshLambertMaterial({ color: 0xf7c948 });
const chips = [];
function buildChips() {
  chips.forEach(c => stall.remove(c));
  chips.length = 0;
  for (let i = 0; i < START_CHIPS; i++) {
    const chip = new THREE.Mesh(chipGeo, chipMat);
    // Rough mound: lower layers wide, upper layers narrow.
    const layer = i < 10 ? 0 : i < 16 ? 1 : 2;
    const spread = [0.5, 0.35, 0.18][layer];
    chip.position.set((Math.random() - 0.5) * spread * 2, 1.36 + layer * 0.07, 0.2 + (Math.random() - 0.5) * spread);
    chip.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * Math.PI, (Math.random() - 0.5) * 0.4);
    chip.castShadow = true;
    stall.add(chip);
    chips.push(chip);
  }
}

// ---------- Gulls ----------
const gullWhite = new THREE.MeshLambertMaterial({ color: 0xffffff });
const gullGrey = new THREE.MeshLambertMaterial({ color: 0xaab7c4 });
const gullTip = new THREE.MeshLambertMaterial({ color: 0x222222 });
const beakMat = new THREE.MeshLambertMaterial({ color: 0xf5b700 });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const hitMat = new THREE.MeshBasicMaterial({ visible: false });

function makeWing(side) {
  const pivot = new THREE.Group();
  const wing = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.38), gullGrey);
  wing.position.x = side * 0.45;
  const tip = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.045, 0.3), gullTip);
  tip.position.x = side * 0.95;
  wing.castShadow = true;
  pivot.add(wing, tip);
  return pivot;
}

function makeGull(big) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), gullWhite);
  body.scale.set(1, 0.85, 1.9);
  body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), gullWhite);
  head.position.set(0, 0.1, 0.42);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 6), beakMat);
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0, 0.07, 0.62);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), eyeMat);
  eyeL.position.set(0.1, 0.15, 0.5);
  const eyeR = eyeL.clone(); eyeR.position.x = -0.1;
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.25), gullGrey);
  tail.position.set(0, 0.02, -0.45);
  const wingL = makeWing(1), wingR = makeWing(-1);
  wingL.position.set(0.12, 0.08, 0.02);
  wingR.position.set(-0.12, 0.08, 0.02);
  // Generous invisible hitbox so fast gulls are fair to tap (bigger on touch screens).
  const hitR = (matchMedia("(pointer: coarse)").matches ? 1.0 : 0.8);
  const hitbox = new THREE.Mesh(new THREE.SphereGeometry(hitR, 8, 6), hitMat);
  g.add(body, head, beak, eyeL, eyeR, tail, wingL, wingR, hitbox);
  if (big) g.scale.setScalar(1.45);
  g.userData = { wingL, wingR, hitbox, body };
  return g;
}

// ---------- Game state ----------
const gulls = [];        // active gull records
const clickables = [];   // hitbox meshes
const feathers = [];
let state = "menu";      // menu | playing | over
let chipsLeft = START_CHIPS, score = 0, elapsed = 0, spawnTimer = 0;
let shake = 0;

const $ = id => document.getElementById(id);
const hudChips = $("chips"), hudScore = $("score"), hudTime = $("time");

function bezier(a, b, c, t, out) {
  const u = 1 - t;
  return out.set(
    u * u * a.x + 2 * u * t * b.x + t * t * c.x,
    u * u * a.y + 2 * u * t * b.y + t * t * c.y,
    u * u * a.z + 2 * u * t * b.z + t * t * c.z,
  );
}

function spawnGull() {
  const big = elapsed > 20 && Math.random() < 0.18;
  const mesh = makeGull(big);
  const side = Math.random() < 0.5 ? -1 : 1;
  const start = new THREE.Vector3(side * (9 + Math.random() * 5), 6 + Math.random() * 4, -3 + Math.random() * 6);
  // Control point: swoop low across the front of the stall before pulling up to the tray.
  const ctrl = new THREE.Vector3(side * (1 + Math.random() * 3), 0.6 + Math.random() * 2.5, 2 + Math.random() * 3);
  const end = trayTarget.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.6, 0, 0));
  // Gulls get faster as the round goes on.
  const duration = Math.max(1.9, 4.6 - elapsed * 0.035) * (big ? 1.25 : 1) * (0.85 + Math.random() * 0.3);
  mesh.position.copy(start);
  scene.add(mesh);
  const gull = { mesh, start, ctrl, end, t: 0, duration, mode: "approach", hp: big ? 2 : 1, vel: new THREE.Vector3(), flap: Math.random() * 6, life: 0, carrying: null, flash: 0 };
  mesh.userData.hitbox.userData.gull = gull;
  clickables.push(mesh.userData.hitbox);
  gulls.push(gull);
}

function removeClickable(gull) {
  const i = clickables.indexOf(gull.mesh.userData.hitbox);
  if (i >= 0) clickables.splice(i, 1);
}

function shoo(gull, hitPoint) {
  gull.hp--;
  puffFeathers(hitPoint, gull.hp > 0 ? 4 : 10);
  sfx.shoo();
  if (gull.hp > 0) {
    // Big gull flinches and loses some progress, but keeps coming.
    gull.flash = 0.25;
    gull.t = Math.max(0, gull.t - 0.25);
    return;
  }
  removeClickable(gull);
  gull.mode = "flee";
  const away = gull.mesh.position.clone().sub(trayTarget).setY(0).normalize();
  if (!isFinite(away.x)) away.set(1, 0, 0);
  gull.vel.copy(away.multiplyScalar(7)).add(new THREE.Vector3(0, 6, -2));
  score++;
  hudScore.textContent = score;
}

function stealChip(gull) {
  removeClickable(gull);
  gull.mode = "escape";
  if (chipsLeft > 0) {
    chipsLeft--;
    hudChips.textContent = chipsLeft;
    const chip = chips.pop();
    stall.remove(chip);
    chip.position.set(0, -0.05, 0.62);
    chip.rotation.set(0, Math.PI / 2, 0);
    gull.mesh.add(chip);
    gull.carrying = chip;
    sfx.squawk();
    shake = 0.25;
  }
  const side = gull.mesh.position.x >= 0 ? 1 : -1;
  gull.vel.set(side * (3 + Math.random() * 2), 5, -6);
  if (chipsLeft === 0 && state === "playing") endGame();
}

// ---------- Feathers ----------
const featherGeo = new THREE.PlaneGeometry(0.12, 0.05);
const featherMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true });
function puffFeathers(p, n) {
  for (let i = 0; i < n; i++) {
    const f = new THREE.Mesh(featherGeo, featherMat.clone());
    f.position.copy(p);
    f.userData = { vel: new THREE.Vector3((Math.random() - 0.5) * 4, Math.random() * 3, (Math.random() - 0.5) * 4), spin: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8), life: 1.2 };
    scene.add(f);
    feathers.push(f);
  }
}

// ---------- Audio (tiny WebAudio blips, no assets) ----------
let actx = null;
function tone(f0, f1, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  shoo: () => tone(500, 1400, 0.12, "triangle", 0.15),
  squawk: () => { tone(900, 500, 0.15, "sawtooth", 0.08); setTimeout(() => tone(1000, 600, 0.18, "sawtooth", 0.08), 120); },
  miss: () => tone(200, 120, 0.06, "sine", 0.06),
};

// ---------- Input: raycast against gull hitboxes ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function onPointerDown(event) {
  if (state !== "playing") return;
  event.preventDefault();
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (hits.length > 0) shoo(hits[0].object.userData.gull, hits[0].point);
  else sfx.miss();
}
// pointerdown covers mouse, pen and touch in one handler.
renderer.domElement.addEventListener("pointerdown", onPointerDown);

// ---------- Round flow ----------
function clearGulls() {
  gulls.forEach(g => scene.remove(g.mesh));
  gulls.length = 0;
  clickables.length = 0;
  feathers.forEach(f => scene.remove(f));
  feathers.length = 0;
}

function startGame() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } }
  actx?.resume?.();
  clearGulls();
  buildChips();
  chipsLeft = START_CHIPS; score = 0; elapsed = 0; spawnTimer = 0.6;
  hudChips.textContent = chipsLeft; hudScore.textContent = 0; hudTime.textContent = "0.0s";
  $("start").classList.add("hidden");
  $("over").classList.add("hidden");
  state = "playing";
}

function endGame() {
  state = "over";
  const best = Math.max(score, +localStorage.getItem("gullwick-best") || 0);
  localStorage.setItem("gullwick-best", best);
  $("finalScore").textContent = score;
  $("finalTime").textContent = elapsed.toFixed(1);
  $("best").textContent = score >= best && score > 0 ? "New best!" : `Best: ${best} gulls`;
  // Let the last thief fly off before showing the card.
  setTimeout(() => { if (state === "over") $("over").classList.remove("hidden"); }, 1200);
}

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);

// ---------- Loop ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3(), ahead = new THREE.Vector3();

function updateGulls(dt) {
  for (let i = gulls.length - 1; i >= 0; i--) {
    const g = gulls[i];
    const m = g.mesh;
    g.life += dt;
    let flapSpeed = 14;

    if (g.mode === "approach") {
      g.t += dt / g.duration;
      if (g.t >= 1) { m.position.copy(g.end); stealChip(g); continue; }
      bezier(g.start, g.ctrl, g.end, g.t, m.position);
      bezier(g.start, g.ctrl, g.end, Math.min(1, g.t + 0.02), ahead);
      if (ahead.distanceToSquared(m.position) > 1e-6) m.lookAt(ahead);
      flapSpeed = g.t > 0.75 ? 22 : 12; // frantic flapping on the final lunge
    } else {
      g.vel.y += (g.mode === "flee" ? 2 : 1) * dt;
      m.position.addScaledVector(g.vel, dt);
      m.lookAt(tmp.copy(m.position).add(g.vel));
      if (g.mode === "flee") m.rotateZ(Math.sin(g.life * 20) * 0.4);
      flapSpeed = 26;
      if (m.position.y > 16 || Math.abs(m.position.x) > 25 || m.position.z < -30) {
        scene.remove(m);
        gulls.splice(i, 1);
        continue;
      }
    }

    g.flap += dt * flapSpeed;
    const a = Math.sin(g.flap) * 0.7;
    m.userData.wingL.rotation.z = a;
    m.userData.wingR.rotation.z = -a;

    if (g.flash > 0) {
      g.flash -= dt;
      m.userData.body.material = g.flash > 0 ? beakMat : gullWhite;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (state === "playing") {
    elapsed += dt;
    hudTime.textContent = elapsed.toFixed(1) + "s";
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnGull();
      // Spawn interval tightens from ~1.9s down to ~0.55s.
      const base = Math.max(0.55, 1.9 - elapsed * 0.025);
      spawnTimer = base * (0.7 + Math.random() * 0.6);
    }
  }
  updateGulls(dt);

  for (let i = feathers.length - 1; i >= 0; i--) {
    const f = feathers[i], u = f.userData;
    u.life -= dt;
    u.vel.y -= 4 * dt;
    u.vel.multiplyScalar(0.96);
    f.position.addScaledVector(u.vel, dt);
    f.rotation.x += u.spin.x * dt; f.rotation.y += u.spin.y * dt;
    f.material.opacity = Math.max(0, u.life);
    if (u.life <= 0) { scene.remove(f); feathers.splice(i, 1); }
  }

  // Gentle waves
  for (let i = 0; i < seaPos.count; i++) {
    const x = seaBase[i * 3], y = seaBase[i * 3 + 1];
    seaPos.array[i * 3 + 2] = Math.sin(x * 0.3 + t * 1.2) * 0.15 + Math.cos(y * 0.4 + t) * 0.12;
  }
  seaPos.needsUpdate = true;
  clouds.forEach((c, i) => { c.position.x += dt * (0.3 + i * 0.05); if (c.position.x > 40) c.position.x = -40; });

  // Small camera shake when a chip is stolen
  if (shake > 0) {
    shake -= dt;
    camera.position.x = (Math.random() - 0.5) * shake * 0.6;
  } else camera.position.x = 0;

  renderer.render(scene, camera);
}

buildChips();
animate();

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
});
</script>
</body>
</html>
