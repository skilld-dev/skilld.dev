<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidewhisk · Architecture</title>
  <style>
    /* No external requests: the skin's fonts resolve if installed locally,
       otherwise the system fallbacks below take over. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet. Must come after the
       svg rule above: a media query adds no specificity. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Tidewhisk</p>
    <h1>Tidewhisk ferry booking</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">Tidewhisk ferry booking</title>
        <desc id="diagram-desc">Architecture of Tidewhisk, where the web app calls an API gateway that routes bookings to the booking service, which holds seats in a cache, saves bookings to the database, and queues payments that mark bookings paid and trigger SMS tickets.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones first (bg → zones → arrows → nodes) -->
        <rect x="728" y="96" width="192" height="240" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="740" y="100" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">DATA</text>

        <rect x="392" y="384" width="528" height="112" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="404" y="388" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="422" y="397" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ASYNC</text>

        <!-- Arrows (behind boxes) -->
        <!-- Web app → API gateway -->
        <line x1="168" y1="288" x2="216" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- API gateway → Booking service (headline path) -->
        <line x1="360" y1="288" x2="408" y2="288" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Booking service top → Seat cache left -->
        <path d="M 488,256 V 168 Q 488,160 496,160 H 744"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Booking service → Database (upper attach) -->
        <line x1="568" y1="276" x2="744" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Booking service → Payments worker (queued job) -->
        <line x1="488" y1="320" x2="488" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Payments worker → Database (lower attach), elbow at x=600 -->
        <path d="M 568,436 H 592 Q 600,436 600,428 V 308 Q 600,300 608,300 H 744"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Payments worker → SMS notifier (async event) -->
        <line x1="568" y1="460" x2="744" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels: opaque mask, 8px gap from the stroke -->
        <rect x="174" y="268" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="192" y="277" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="368" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="277" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOOK</text>

        <rect x="590" y="140" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOLD SEAT</text>

        <rect x="618" y="256" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE BOOKING</text>

        <rect x="496" y="362" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="518" y="371" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHARGE</text>

        <rect x="608" y="336" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="638" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MARK PAID</text>

        <rect x="636" y="440" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEND TICKET</text>

        <!-- Node: Web app (client) -->
        <rect x="40" y="256" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="256" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="273" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="104" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web app</text>
        <text x="104" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · mobile</text>

        <!-- Node: API gateway -->
        <rect x="216" y="256" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="256" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="224" y="264" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="240" y="273" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="288" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API gateway</text>
        <text x="288" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth · rate limit</text>

        <!-- Node: Booking service (focal) -->
        <rect x="408" y="256" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="408" y="256" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="416" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="430" y="273" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="488" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking service</text>
        <text x="488" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds · confirms</text>

        <!-- Node: Seat cache (store) -->
        <rect x="744" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="128" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="752" y="136" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="770" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="824" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seat cache</text>
        <text x="824" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Redis · hold TTL</text>

        <!-- Node: Database (store) -->
        <rect x="744" y="256" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="256" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="752" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="766" y="273" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="824" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="824" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres · bookings</text>

        <!-- Node: Payments worker -->
        <rect x="408" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="408" y="416" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="416" y="424" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="430" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
        <text x="488" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payments worker</text>
        <text x="488" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">card charge · retry</text>

        <!-- Node: SMS notifier -->
        <rect x="744" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="416" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="752" y="424" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="766" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SMS</text>
        <text x="824" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SMS notifier</text>
        <text x="824" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tickets · delays</text>

        <!-- Legend strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal service</text>

        <rect x="168" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="188" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

        <rect x="280" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="300" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

        <rect x="392" y="568" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="412" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

        <line x1="488" y1="573" x2="516" y2="573" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="524" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="624" y1="573" x2="652" y2="573" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="660" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

        <line x1="760" y1="573" x2="788" y2="573" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="796" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async job</text>
      </svg>
    </div>
  </div>
</body>
</html>
