<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hailbroom</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a2f5a 0%, #12142a 60%, #0a0b18 100%);
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    color: #f4f1ff;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: relative; line-height: 0; }
  canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  body.playing canvas { cursor: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    line-height: 1.3;
    text-align: center;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(14, 16, 36, .78), rgba(14, 16, 36, .4) 55%, rgba(14, 16, 36, .78));
    opacity: 0;
    transform: scale(.94);
    pointer-events: none;
    transition: opacity .22s ease-out, transform .38s cubic-bezier(.34, 1.56, .64, 1);
  }
  .overlay.show { opacity: 1; transform: none; pointer-events: auto; }
  h1 {
    margin: 0;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: .02em;
    text-shadow: 0 5px 0 #0b0d20, 0 0 34px rgba(150, 200, 255, .4);
    animation: bob 2.6s ease-in-out infinite;
  }
  h1 span { color: #ffd36b; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
  #status { margin: 0; font-size: 18px; max-width: 24ch; opacity: .92; }
  #result { margin: 0; font-size: 22px; font-weight: 800; color: #ffd36b; }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 22px;
    color: #1a1630;
    background: #ffd36b;
    border: 0;
    border-radius: 999px;
    padding: 14px 38px;
    cursor: pointer;
    box-shadow: 0 5px 0 #b3862c, 0 10px 24px rgba(0, 0, 0, .35);
    transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), box-shadow .12s ease-out;
  }
  button:hover { transform: translateY(-2px) scale(1.05); }
  button:active { transform: translateY(3px) scale(.97); box-shadow: 0 2px 0 #b3862c, 0 4px 10px rgba(0, 0, 0, .3); transition-duration: .05s; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .toggles button, .toggles button:active {
    font-size: 14px;
    padding: 8px 14px;
    color: #f4f1ff;
    background: rgba(255, 255, 255, .1);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  }
  .hint { margin: 0; font-size: 13px; max-width: 32ch; opacity: .7; }
  @media (prefers-reduced-motion: reduce) {
    .overlay { transform: none; transition: opacity .2s; }
    button { transition: none; }
    h1 { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" role="img" aria-label="Hailbroom. Sweep the broom to bat falling hailstones back into the sky."></canvas>
  <div id="menu" class="overlay show" role="dialog" aria-labelledby="title">
    <h1 id="title">Hail<span>broom</span></h1>
    <p id="status"></p>
    <p id="result" hidden></p>
    <button id="play" type="button">Play</button>
    <div class="toggles">
      <button id="shake" type="button"></button>
      <button id="flashes" type="button"></button>
      <button id="sound" type="button"></button>
    </div>
    <p class="hint">Sweep with the arrow keys, A and D, or the mouse. Swing fast into a stone to smash it. Press P to pause.</p>
  </div>
</div>
<script>
'use strict';

// ---------- tuning ----------
const TAU = Math.PI * 2;
const W = 540;
const H = 800;
const GROUND_Y = H - 46;
const BROOM_Y = H - 122;            // where the bristles meet the binding
const BRISTLE_H = 42;
const BASE_HALF = 18;
const TIP_HALF = 62;
const BROOM_MIN_X = 40;
const BROOM_MAX_X = W - 40;
const GRAVITY = 400;
const KEY_SPEED = 950;
const KEY_MAX_SPEED = 1600;
const MAX_BROOM_SPEED = 2600;
const POWER_SPEED = 1250;           // swing faster than this and a hit becomes a smash
const SWOOSH_SPEED = 1350;
const SQUASH_DUR = 0.22;
const HITSTOP_SCALE = 0.04;
const TRAUMA_DECAY = 1.4;
const MAX_SHAKE_X = 16;
const MAX_SHAKE_Y = 12;
const MAX_ROLL = 0.035;
const SLOWMO_DUR = 1.2;
const LIGHTNING_DUR = 0.22;
const SHAKE_LEVELS = [1, 0.5, 0];
const SHAKE_LABELS = ['Shake 100%', 'Shake 50%', 'Shake off'];

const SIZES = [
  { r: 9, points: 10, launch: 1040 },
  { r: 13, points: 15, launch: 990 },
  { r: 20, points: 30, launch: 910 },
];

// Feedback presets by importance. Each hit picks one tier, so juice stays proportional.
const TIERS = [
  { trauma: 0.24, stop: 0.035, kick: 4, zoom: 0, flash: 0, shards: 8, sparks: 4, ring: 3, squash: 0.28, recoil: 6, color: '#e8f4ff' },
  { trauma: 0.4, stop: 0.055, kick: 7, zoom: 0.012, flash: 0, shards: 13, sparks: 7, ring: 3.6, squash: 0.4, recoil: 10, color: '#a8dcff' },
  { trauma: 0.65, stop: 0.095, kick: 11, zoom: 0.03, flash: 0.28, shards: 24, sparks: 12, ring: 4.4, squash: 0.52, recoil: 16, color: '#ffd36b' },
];

const ICE = ['#ffffff', '#e4f3ff', '#b9dcff', '#9cc8f2'];
const STRAW = ['#f0cf74', '#d9a94a', '#c08a32'];
const TULIP_COLORS = ['#ff5d73', '#ffb84d', '#ff7ac8', '#ffe066', '#ff6b4a'];
const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';

// ---------- helpers ----------
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (list) => list[(Math.random() * list.length) | 0];
const fmt = (n) => n.toLocaleString('en-US');
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// Damped spring: underdamped settings overshoot a little, which reads as life.
const spring = (s, target, k, d, dt) => { s.v += ((target - s.x) * k - s.v * d) * dt; s.x += s.v * dt; };
// Layered sines give smooth shake. A fresh random offset each frame would buzz.
const wobble = (t, seed) => 0.6 * Math.sin(t * 47 + seed) + 0.4 * Math.sin(t * 89 + seed * 2.3);

// ---------- storage ----------
function readStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (err) {
    console.warn(`Hailbroom could not read ${key}. It uses defaults.`, err);
    return fallback;
  }
}
function writeStore(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    console.warn(`Hailbroom could not save ${key}.`, err);
  }
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function parseSettings(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  return {
    shake: [0, 1, 2].includes(r.shake) ? r.shake : (reduceMotion ? 2 : 0),
    flashes: typeof r.flashes === 'boolean' ? r.flashes : !reduceMotion,
    sound: typeof r.sound === 'boolean' ? r.sound : true,
  };
}
const settings = parseSettings(readStore('hailbroom.settings', null));
let best = Math.max(0, Number(readStore('hailbroom.best', 0)) || 0);

// ---------- audio (synthesized, no files) ----------
function createSfx() {
  let ac = null;
  let out = null;
  let noiseBuf = null;

  const unlock = () => {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return; // No Web Audio: the game runs silent.
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 8;
      comp.ratio.value = 5;
      comp.connect(ac.destination);
      out = ac.createGain();
      out.gain.value = 0.6;
      out.connect(comp);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume().catch((err) => console.warn('Hailbroom could not start audio.', err));
  };
  const live = () => ac !== null && settings.sound;
  const envelope = (param, t, peak, attack, decay) => {
    param.setValueAtTime(0.0001, t);
    param.exponentialRampToValueAtTime(peak, t + attack);
    param.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  };
  const tone = (type, f0, f1, dur, peak, delay = 0) => {
    const t = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    envelope(gain.gain, t, peak, 0.004, dur);
    osc.connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  };
  const noise = (type, f0, f1, q, dur, peak, delay = 0, attack = 0.003) => {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const filter = ac.createBiquadFilter();
    filter.type = type;
    filter.Q.value = q;
    filter.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) filter.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gain = ac.createGain();
    envelope(gain.gain, t, peak, attack, dur);
    src.connect(filter).connect(gain).connect(out);
    src.start(t, Math.random() * 0.5);
    src.stop(t + attack + dur + 0.05);
  };
  const vary = () => rand(0.94, 1.06);
  const PENTA = [0, 2, 4, 7, 9];
  const note = (base, step) => base * Math.pow(2, (PENTA[step % 5] + 12 * Math.floor(step / 5)) / 12);

  return {
    unlock,
    hit(tier, combo, power) {
      if (!live()) return;
      // Pitch climbs with the combo, so a streak sounds like it is building.
      const p = (1 + Math.min(combo, 20) * 0.022) * vary();
      if (tier === 0) {
        noise('bandpass', 2800 * p, 1100 * p, 1.3, 0.07, 0.5);
        tone('triangle', 330 * p, 110 * p, 0.09, 0.5);
        tone('sine', 3100 * p, 2600 * p, 0.05, 0.12);
      } else if (tier === 1) {
        noise('bandpass', 2100 * p, 650 * p, 1.1, 0.11, 0.7);
        tone('triangle', 250 * p, 70 * p, 0.14, 0.65);
        tone('sine', 2500 * p, 2100 * p, 0.07, 0.14);
      } else {
        noise('lowpass', 3600 * p, 280, 0.7, 0.24, 0.85);
        tone('sine', 150 * p, 38, 0.3, 0.95);
        tone('square', 190 * p, 60, 0.08, 0.18);
        tone('sine', 1900 * p, 1500 * p, 0.12, 0.1, 0.015);
      }
      if (power) noise('highpass', 5000, 3000, 0.8, 0.05, 0.35);
    },
    sky(step) {
      if (!live()) return;
      const f = note(660, Math.min(step, 14));
      tone('sine', f, f, 0.28, 0.16);
      tone('sine', f * 2.005, f * 2.005, 0.18, 0.05);
    },
    wall() {
      if (!live()) return;
      tone('square', 1500 * vary(), 1200, 0.025, 0.05);
    },
    ground() {
      if (!live()) return;
      noise('lowpass', 1100, 180, 0.8, 0.32, 0.8);
      tone('sine', 120, 36, 0.32, 0.9);
      noise('highpass', 3200, 2400, 0.9, 0.14, 0.22, 0.01);
    },
    crush() {
      if (!live()) return;
      tone('triangle', 520, 180, 0.2, 0.25, 0.03);
      noise('bandpass', 900, 400, 2, 0.12, 0.3, 0.02);
    },
    swoosh(speed) {
      if (!live()) return;
      const k = clamp(speed / 2400, 0.5, 1);
      noise('bandpass', 450, 2400 * k, 0.9, 0.16, 0.16 * k, 0, 0.03);
    },
    milestone() {
      if (!live()) return;
      [0, 4, 7, 12].forEach((n, i) => {
        const f = 660 * Math.pow(2, n / 12);
        tone('triangle', f, f, 0.22, 0.14, i * 0.06);
      });
      noise('lowpass', 260, 120, 0.7, 0.9, 0.25, 0.05, 0.05);
    },
    start() {
      if (!live()) return;
      tone('triangle', 440, 440, 0.1, 0.18);
      tone('triangle', 660, 660, 0.14, 0.18, 0.08);
    },
    over() {
      if (!live()) return;
      tone('sawtooth', 420, 70, 1.0, 0.16);
      tone('sine', 110, 30, 0.6, 0.8);
      noise('lowpass', 1500, 120, 0.7, 0.8, 0.5);
    },
    best() {
      if (!live()) return;
      [0, 4, 7, 12, 16].forEach((n, i) => {
        const f = 523 * Math.pow(2, n / 12);
        tone('triangle', f, f, 0.25, 0.15, i * 0.07);
      });
    },
  };
}
const sfx = createSfx();

// ---------- canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewScale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
  canvas.style.width = `${W * viewScale}px`;
  canvas.style.height = `${H * viewScale}px`;
  canvas.width = Math.round(W * viewScale * dpr);
  canvas.height = Math.round(H * viewScale * dpr);
}

const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
skyGrad.addColorStop(0, '#161a38');
skyGrad.addColorStop(0.45, '#2b3062');
skyGrad.addColorStop(0.8, '#4b4f86');
skyGrad.addColorStop(1, '#5d5f92');
const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
groundGrad.addColorStop(0, '#264d33');
groundGrad.addColorStop(1, '#122217');
const vignetteGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
const missGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7);
missGrad.addColorStop(0, 'rgba(255,40,70,0)');
missGrad.addColorStop(1, 'rgba(255,40,70,0.55)');
const strawGrad = ctx.createLinearGradient(0, 0, 0, -BRISTLE_H);
strawGrad.addColorStop(0, '#c99a3a');
strawGrad.addColorStop(1, '#f3d27a');
const handleGrad = ctx.createLinearGradient(-5, 0, 5, 0);
handleGrad.addColorStop(0, '#7a4a22');
handleGrad.addColorStop(0.45, '#c48a4f');
handleGrad.addColorStop(1, '#6e421d');

// Pre-rendered hailstone bodies: 3 sizes, 3 lumpy variants each.
function makeStoneSprite(r) {
  const S = 3;
  const size = (r + 6) * 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * S;
  const g = c.getContext('2d');
  g.scale(S, S);
  g.translate(size / 2, size / 2);
  g.beginPath();
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    const rr = r * rand(0.9, 1.04);
    if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  g.closePath();
  const grad = g.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
  grad.addColorStop(0, '#f4fbff');
  grad.addColorStop(0.6, '#cfe6ff');
  grad.addColorStop(1, '#94bde6');
  g.shadowColor = 'rgba(170, 215, 255, 0.8)';
  g.shadowBlur = 6;
  g.fillStyle = grad;
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = 'rgba(60, 100, 160, 0.55)';
  g.lineWidth = 1.2;
  g.stroke();
  g.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  g.lineWidth = 1;
  g.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = rand(0, TAU);
    g.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
    g.lineTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75);
  }
  g.stroke();
  return { canvas: c, size };
}
const stoneSprites = SIZES.map(({ r }) => [0, 1, 2].map(() => makeStoneSprite(r)));

// ---------- world ----------
let state = 'attract'; // attract | playing | paused | over
let menuMode = 'start';
let score = 0;
let combo = 0;
let elapsed = 0;
let time = 0;
let spawnTimer = 0.5;
let overTimer = 0;
let newBest = false;

// Feedback state. These run on real time, so they keep moving during hit-stop.
let trauma = 0;
let shakeClock = 0;
let zoom = 0;
let kickY = 0;
let flashA = 0;
let missA = 0;
let hitStop = 0;
let slowmo = 0;
let lightning = 0;
let cloudGlow = 0;
let scorePop = 0;
let comboPop = 0;
let bolt = [];

const stones = [];
const popups = [];
const keys = { left: false, right: false };
let inputMode = 'pointer';

const broom = {
  x: W / 2,
  v: 0,
  targetX: W / 2,
  tilt: { x: 0, v: 0 },
  lag: { x: 0, v: 0 },
  squash: { x: 0, v: 0 },
  recoil: { x: 0, v: 0 },
  flash: 0,
  swooshCd: 0,
  wasFast: false,
  streakAcc: 0,
  keyHold: 0,
  keyDir: 0,
  history: [],
};
const STRANDS = Array.from({ length: 15 }, (_, i) => ({ u: -1 + (2 * i) / 14 + rand(-0.04, 0.04), len: rand(0.86, 1.04), dark: i % 2 === 0 }));

const tulips = TULIP_COLORS.map((color, i) => ({ x: (W / 6) * (i + 1), alive: true, color, phase: rand(0, TAU), sway: { x: 0, v: 0 }, pop: { x: 0, v: 0 } }));
const clouds = Array.from({ length: 16 }, (_, i) => ({ x: (i * (W + 120)) / 16 - 60, y: rand(-6, 22), r: rand(34, 52), drift: rand(6, 14), bump: { x: 0, v: 0 } }));
const rain = Array.from({ length: 46 }, () => ({ x: rand(-40, W), y: rand(-20, H), len: rand(10, 22), speed: rand(480, 780) }));
const GRASS = Array.from({ length: Math.ceil((W + 160) / 8) + 1 }, () => rand(2, 9));

// ---------- particles (pooled ring buffer) ----------
const P_SHARD = 0;
const P_SPARK = 1;
const P_MIST = 2;
const P_PETAL = 3;
const P_STAR = 4;
const P_RING = 5;
const MAX_PARTICLES = 600;
const particles = Array.from({ length: MAX_PARTICLES }, () => ({ alive: false, kind: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, rot: 0, spin: 0, color: '#fff', grav: 0, drag: 0, grow: 1 }));
let nextParticle = 0;

function emit(kind, x, y, vx, vy, life, size, color, grav = 0, drag = 0, grow = 1) {
  const p = particles[nextParticle];
  nextParticle = (nextParticle + 1) % MAX_PARTICLES; // the oldest particle gets recycled
  p.alive = true;
  p.kind = kind;
  p.x = x;
  p.y = y;
  p.vx = vx;
  p.vy = vy;
  p.life = life;
  p.max = life;
  p.size = size;
  p.color = color;
  p.grav = grav;
  p.drag = drag;
  p.grow = grow;
  p.rot = rand(0, TAU);
  p.spin = rand(-14, 14);
  return p;
}

function updateParticles(dt) {
  for (const p of particles) {
    if (!p.alive) continue;
    p.life -= dt;
    if (p.life <= 0) { p.alive = false; continue; }
    const damp = 1 - p.drag * dt;
    p.vx *= damp;
    p.vy = p.vy * damp + p.grav * dt;
    if (p.kind === P_PETAL) p.vx += Math.sin(p.life * 9 + p.rot) * 220 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if ((p.kind === P_SHARD || p.kind === P_PETAL) && p.y > GROUND_Y + 6 && p.vy > 0) {
      p.y = GROUND_Y + 6;
      p.vy *= -0.3;
      p.vx *= 0.5;
      p.spin *= 0.5;
    }
  }
}

function popup(text, x, y, color, size = 20, life = 0.8, centered = false) {
  popups.push({ text, x, y, color, size, life, t: 0, drift: centered ? 0 : rand(-24, 24) });
}

// ---------- feedback bundles ----------
const shakeLevel = () => SHAKE_LEVELS[settings.shake];
const addTrauma = (amount) => { trauma = Math.min(1, trauma + amount); };   // hits add, never reset
const freeze = (duration) => { hitStop = Math.max(hitStop, duration); };     // overlapping hits keep the longest stop
const multiplier = () => 1 + Math.min(5, Math.floor(combo / 8));

function burstHit(x, y, tier, dir) {
  const T = TIERS[tier];
  emit(P_RING, x, y, 0, 0, 0.3 + tier * 0.06, 8 + tier * 3, '#e6f4ff', 0, 0, T.ring);
  for (let i = 0; i < T.shards; i++) {
    const a = dir + rand(-1.2, 1.2);
    const sp = rand(160, 480) * (1 + tier * 0.3);
    emit(P_SHARD, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.35, 0.75), rand(2, 4) + tier, pick(ICE), 1100, 1.4);
  }
  for (let i = 0; i < T.sparks; i++) {
    const a = dir + rand(-0.7, 0.7);
    const sp = rand(520, 980);
    emit(P_SPARK, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.1, 0.2), rand(1.5, 2.6), '#fff4d6', 200, 4);
  }
  for (let i = 0; i < 2 + tier * 2; i++) {
    emit(P_MIST, x + rand(-8, 8), y + rand(-4, 4), rand(-70, 70), rand(-90, -20), rand(0.3, 0.55), rand(6, 11) + tier * 3, '#ffffff', 0, 3);
  }
  // Loose straw flies off the broom.
  for (let i = 0; i < 2 + tier; i++) {
    const a = -Math.PI / 2 + rand(-1.4, 1.4);
    const sp = rand(80, 220);
    emit(P_SHARD, x, y + 8, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 0.9), rand(1.5, 2.5), pick(STRAW), 900, 1);
  }
}

function onHit(s, lx) {
  const b = broom;
  const power = Math.abs(b.v) > POWER_SPEED;
  const tier = Math.min(2, s.size + (power ? 1 : 0));
  const T = TIERS[tier];
  const overdrive = power && s.size === 2; // biggest stone, full swing

  // Launch: where it lands on the bristles sets the angle; swing speed adds power.
  const t = clamp(lx / TIP_HALF, -1, 1);
  const ang = clamp(t * 0.8 + b.tilt.x * 0.6 + b.v * 0.00008, -0.95, 0.95);
  const speed = SIZES[s.size].launch + Math.min(Math.abs(b.v), 2400) * 0.12 + (power ? 120 : 0);
  s.vx = Math.sin(ang) * speed;
  s.vy = -Math.cos(ang) * speed;
  s.y = Math.min(s.y, BROOM_Y - BRISTLE_H - s.r * 0.4);
  s.spin = rand(-10, 10) + b.v * 0.004;
  s.cooldown = 0.2;
  s.flash = 0.07;
  s.squashT = 0;
  s.squashAmt = 0.35 + tier * 0.08;
  s.squashAngle = -Math.PI / 2 + b.tilt.x;
  s.hits++;

  // Broom: instant squash and dip, then springs back past rest.
  b.squash.x = Math.max(b.squash.x, T.squash);
  b.squash.v = 0;
  b.recoil.x = Math.max(b.recoil.x, T.recoil);
  b.flash = 0.08;

  // Camera and time.
  addTrauma(T.trauma + (overdrive ? 0.22 : 0));
  freeze(T.stop + (overdrive ? 0.04 : 0));
  kickY = Math.max(kickY, T.kick);
  zoom = Math.max(zoom, T.zoom + (overdrive ? 0.02 : 0));
  if (T.flash && settings.flashes) flashA = Math.max(flashA, T.flash);

  const cx = s.x;
  const cy = s.y + s.r * 0.7;
  burstHit(cx, cy, tier, Math.atan2(s.vy, s.vx));

  if (state === 'playing') {
    combo++;
    const gained = SIZES[s.size].points * multiplier() * (power ? 2 : 1);
    score += gained;
    scorePop = 1;
    comboPop = 1;
    popup(`+${gained}`, cx, cy - 20, T.color, 18 + tier * 5);
    if (combo % 10 === 0) milestone();
  }
  if (power) popup(overdrive ? 'MEGA SMASH!' : 'SMASH!', cx, cy - 54, '#ff9a5c', overdrive ? 30 : 24, 0.9);
  sfx.hit(tier, state === 'playing' ? combo : s.hits, power);
}

function milestone() {
  popup(`${combo} COMBO!`, W / 2, H * 0.36, '#ffd36b', 40, 1.2, true);
  addTrauma(0.15);
  strikeLightning();
  sfx.milestone();
  for (const t of tulips) if (t.alive) t.pop.v += 6; // the garden cheers
}

function strikeLightning() {
  if (!settings.flashes) { cloudGlow = 1; return; }
  lightning = LIGHTNING_DUR;
  let x = rand(80, W - 80);
  let y = 30;
  bolt = [[x, y]];
  while (y < 360) {
    x += rand(-30, 30);
    y += rand(18, 36);
    bolt.push([x, y]);
  }
}

function onEscape(s) {
  for (let i = 0; i < 7; i++) {
    emit(P_STAR, s.x + rand(-12, 12), 52, rand(-90, 90), rand(30, 170), rand(0.45, 0.8), rand(3, 5.5), pick(['#fff6c9', '#ffd36b', '#ffffff']), 120, 1.5);
  }
  emit(P_RING, s.x, 50, 0, 0, 0.35, 8, '#fff0be', 0, 0, 3.2);
  for (const c of clouds) {
    const d = Math.abs(c.x - s.x);
    if (d < 90) c.bump.v -= 220 * (1 - d / 90);
  }
  cloudGlow = Math.max(cloudGlow, 0.5);
  if (state === 'playing') {
    const bonus = 5 * multiplier();
    score += bonus;
    scorePop = Math.max(scorePop, 0.6);
    popup(`+${bonus}`, s.x, 96, '#fff6c9', 15, 0.7);
  }
  sfx.sky(state === 'playing' ? combo : s.hits);
}

function onGround(s) {
  for (let i = 0; i < 10 + s.size * 6; i++) {
    const a = -Math.PI / 2 + rand(-1.3, 1.3);
    const sp = rand(120, 420);
    emit(P_SHARD, s.x, GROUND_Y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.5, 0.9), rand(2, 4.5), pick(ICE), 900, 0.8);
  }
  for (let i = 0; i < 4; i++) emit(P_MIST, s.x + rand(-10, 10), GROUND_Y, rand(-80, 80), rand(-60, -10), rand(0.4, 0.6), rand(8, 14), '#dde8ff', 0, 3);
  addTrauma(0.32 + s.size * 0.08);
  kickY = Math.max(kickY, 6);
  sfx.ground();
  for (const t of tulips) {
    const d = Math.abs(t.x - s.x);
    if (t.alive && d < 140) t.sway.v += (t.x < s.x ? -1 : 1) * 6 * (1 - d / 140);
  }
  if (state === 'playing') loseTulip(s.x);
}

function loseTulip(x) {
  let target = null;
  let nearest = Infinity;
  for (const t of tulips) {
    const d = Math.abs(t.x - x);
    if (t.alive && d < nearest) { nearest = d; target = t; }
  }
  if (!target) return;
  target.alive = false;
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + rand(-1.2, 1.2);
    const sp = rand(120, 320);
    emit(P_PETAL, target.x, GROUND_Y - 36, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.9, 1.4), rand(4, 6), target.color, 420, 2.2).spin = rand(-5, 5);
  }
  for (let i = 0; i < 5; i++) emit(P_SHARD, target.x, GROUND_Y - 16, rand(-160, 160), rand(-260, -80), rand(0.5, 0.8), rand(2, 3), '#4fae5c', 900, 1);
  sfx.crush();
  freeze(0.06);
  addTrauma(0.2);
  missA = 1;
  if (combo >= 3) popup('Combo lost', W / 2, H * 0.45, '#ff8a8a', 22, 0.9, true);
  combo = 0;
  popup('-1 tulip', target.x, GROUND_Y - 64, '#ff8a8a', 18);
  if (!tulips.some((t) => t.alive)) gameOver();
}

// ---------- game flow ----------
function startGame() {
  sfx.unlock();
  score = 0;
  combo = 0;
  elapsed = 0;
  spawnTimer = 0.6;
  newBest = false;
  stones.length = 0;
  popups.length = 0;
  for (const t of tulips) { t.alive = true; t.pop.v += 8; }
  state = 'playing';
  hideMenu();
  sfx.start();
}

function gameOver() {
  state = 'over';
  overTimer = 0;
  slowmo = SLOWMO_DUR;
  addTrauma(0.9);
  zoom = Math.max(zoom, 0.05);
  if (settings.flashes) flashA = 0.35;
  newBest = score > best;
  if (newBest) { best = score; writeStore('hailbroom.best', best); }
  sfx.over();
}

function pause() {
  if (state !== 'playing') return;
  state = 'paused';
  keys.left = keys.right = false;
  showMenu('paused');
}

function resume() {
  if (state !== 'paused') return;
  state = 'playing';
  hideMenu();
}

function primaryAction() {
  if (menuMode === 'paused') resume();
  else startGame();
}

// ---------- simulation ----------
function spawnInterval() { return Math.max(0.36, 1.15 * Math.pow(0.988, elapsed)); }

function spawnStone() {
  const large = Math.min(0.05 + elapsed * 0.0016, 0.2);
  const roll = Math.random();
  const size = roll < large ? 2 : roll < large + 0.3 ? 1 : 0;
  const r = SIZES[size].r;
  stones.push({
    x: rand(r + 14, W - r - 14), y: -r - rand(20, 60), vx: rand(-35, 35), vy: rand(60, 150),
    r, size, variant: (Math.random() * 3) | 0, rot: rand(0, TAU), spin: rand(-3, 3),
    cooldown: 0, flash: 0, squashT: SQUASH_DUR, squashAmt: 0, squashAngle: 0, trail: 0, hits: 0,
  });
}

function updateBroom(dt) {
  const b = broom;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0) inputMode = 'keys';
  if (inputMode === 'keys') {
    // Holding one direction builds momentum, so a long sweep can reach smash speed.
    b.keyHold = dir !== 0 && dir === b.keyDir ? b.keyHold + dt : 0;
    b.keyDir = dir;
    const target = dir * lerp(KEY_SPEED, KEY_MAX_SPEED, clamp(b.keyHold / 0.45, 0, 1));
    const turning = dir !== 0 && Math.sign(b.v) === -dir;
    const accel = dir === 0 ? 7000 : turning ? 16000 : 9000;
    b.v += clamp(target - b.v, -accel * dt, accel * dt);
  } else {
    b.v += ((b.targetX - b.x) * 1100 - b.v * 58) * dt;
    b.v = clamp(b.v, -MAX_BROOM_SPEED, MAX_BROOM_SPEED);
  }
  b.x += b.v * dt;
  if (b.x < BROOM_MIN_X) { b.x = BROOM_MIN_X; if (b.v < 0) b.v = 0; }
  if (b.x > BROOM_MAX_X) { b.x = BROOM_MAX_X; if (b.v > 0) b.v = 0; }

  // Visual pose: the handle trails the swing, bristle tips lag behind.
  spring(b.tilt, clamp(b.v * 0.00026, -0.42, 0.42), 260, 16, dt);
  spring(b.lag, clamp(-b.v * 0.011, -16, 16), 420, 14, dt);
  spring(b.squash, 0, 520, 15, dt);
  spring(b.recoil, 0, 700, 16, dt);
  b.flash = Math.max(0, b.flash - dt);

  const speed = Math.abs(b.v);
  b.swooshCd -= dt;
  const fast = speed > SWOOSH_SPEED;
  if (fast && !b.wasFast && b.swooshCd <= 0) { sfx.swoosh(speed); b.swooshCd = 0.22; }
  b.wasFast = fast;

  if (speed > 1100) {
    b.streakAcc += dt;
    const c = Math.cos(b.tilt.x);
    const sn = Math.sin(b.tilt.x);
    const lx = -Math.sign(b.v) * TIP_HALF;
    const ly = -BRISTLE_H + 6;
    while (b.streakAcc > 0.016) {
      b.streakAcc -= 0.016;
      emit(P_SPARK, b.x + lx * c - ly * sn, BROOM_Y + lx * sn + ly * c + rand(-8, 8), -b.v * 0.2, rand(-30, 30), 0.16, 1.4, 'rgba(255,255,255,0.7)', 0, 6);
    }
  } else {
    b.streakAcc = 0;
  }
}

function tryHit(s) {
  if (s.cooldown > 0 || s.vy < -250) return;
  const b = broom;
  const c = Math.cos(b.tilt.x);
  const sn = Math.sin(b.tilt.x);
  const dx = s.x - b.x;
  const dy = s.y - BROOM_Y;
  const lx = c * dx + sn * dy;
  const ly = -sn * dx + c * dy;
  if (ly < -BRISTLE_H - s.r || ly > 12) return;
  const k = clamp(-ly / BRISTLE_H, 0, 1);
  const half = lerp(BASE_HALF, TIP_HALF, k) + s.r * 0.8;
  if (Math.abs(lx) > half) return;
  onHit(s, lx);
}

function updateStones(dt) {
  const vmaxBase = Math.min(380 + elapsed * 3.2, 740);
  for (let i = stones.length - 1; i >= 0; i--) {
    const s = stones[i];
    s.vy = Math.min(s.vy + GRAVITY * dt, vmaxBase + s.size * 20);
    s.vx *= 1 - 0.25 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.spin * dt;
    s.cooldown -= dt;
    s.flash -= dt;
    s.squashT += dt;

    if (s.x < s.r || s.x > W - s.r) {
      s.x = clamp(s.x, s.r, W - s.r);
      if (Math.abs(s.vx) > 80) {
        sfx.wall();
        for (let j = 0; j < 3; j++) emit(P_SHARD, s.x, s.y, -Math.sign(s.vx) * rand(60, 160), rand(-80, 80), 0.3, 2, pick(ICE), 600, 1);
      }
      s.vx = (s.x < W / 2 ? 1 : -1) * Math.abs(s.vx) * 0.75;
    }

    tryHit(s);

    if (s.vy < -350) {
      s.trail += dt;
      while (s.trail > 0.025) {
        s.trail -= 0.025;
        emit(P_MIST, s.x + rand(-2, 2), s.y + rand(-2, 2), 0, 0, 0.3, s.r * 0.55, '#cfe6ff');
      }
    }

    const gone = s.y < -s.r - 12 && s.vy < 0;
    const landed = s.y + s.r >= GROUND_Y;
    if (gone) onEscape(s);
    else if (landed) onGround(s);
    if (gone || landed) {
      stones[i] = stones[stones.length - 1];
      stones.pop();
    }
  }
}

function update(dt) {
  time += dt;
  if (state === 'playing') {
    elapsed += dt;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnStone();
      if (elapsed > 30 && Math.random() < 0.12) spawnStone();
      spawnTimer = spawnInterval() * rand(0.8, 1.2);
    }
  } else {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && stones.length < 4) {
      spawnStone();
      spawnTimer = rand(1.2, 1.8);
    }
  }
  updateBroom(dt);
  updateStones(dt);
  updateParticles(dt);
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t >= popups[i].life) popups.splice(i, 1);
  }
  for (const t of tulips) {
    spring(t.sway, 0, 60, 4, dt);
    spring(t.pop, 0, 180, 9, dt);
  }
  for (const c of clouds) {
    c.x += c.drift * dt;
    if (c.x > W + 60) c.x -= W + 120;
    spring(c.bump, 0, 120, 6, dt);
  }
  for (const r of rain) {
    r.y += r.speed * dt;
    r.x += r.speed * 0.2 * dt;
    if (r.y > GROUND_Y) { r.y = rand(-40, 0); r.x = rand(-80, W); }
  }
}

// Fixed small substeps keep springs stable and stop fast stones tunnelling through the broom.
function step(dt) {
  const n = Math.max(1, Math.ceil(dt / (1 / 120)));
  for (let i = 0; i < n; i++) update(dt / n);
}

function recordBroomPose() {
  const h = broom.history;
  h.push({ x: broom.x, tilt: broom.tilt.x });
  if (h.length > 5) h.shift();
}

// ---------- drawing ----------
function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-80, -80, W + 160, H + 160);
  if (lightning > 0) {
    const a = lightning / LIGHTNING_DUR;
    ctx.fillStyle = `rgba(190, 200, 255, ${0.22 * a})`;
    ctx.fillRect(-80, -80, W + 160, H + 160);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    bolt.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    ctx.strokeStyle = `rgba(180, 200, 255, ${0.3 * a})`;
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.strokeStyle = `rgba(255, 255, 255, ${a})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawRain() {
  ctx.strokeStyle = 'rgba(180, 200, 255, 0.13)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const r of rain) {
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x - r.len * 0.2, r.y - r.len);
  }
  ctx.stroke();
}

function drawGround() {
  ctx.fillStyle = groundGrad;
  ctx.fillRect(-80, GROUND_Y, W + 160, H - GROUND_Y + 80);
  ctx.fillStyle = '#356b43';
  ctx.beginPath();
  ctx.moveTo(-80, GROUND_Y + 8);
  for (let i = 0; i < GRASS.length; i++) {
    const x = -80 + i * 8;
    ctx.lineTo(x + 4, GROUND_Y - GRASS[i]);
    ctx.lineTo(x + 8, GROUND_Y + 4);
  }
  ctx.lineTo(W + 80, GROUND_Y + 8);
  ctx.closePath();
  ctx.fill();
}

function drawTulips() {
  ctx.lineCap = 'round';
  for (const t of tulips) {
    ctx.save();
    ctx.translate(t.x, GROUND_Y + 6);
    if (!t.alive) {
      ctx.strokeStyle = '#2f6a3a';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(2, -6, 10, -4);
      ctx.stroke();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.ellipse(15, -2, 7, 2.5, 0.2, 0, TAU);
      ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.rotate(Math.sin(time * 1.7 + t.phase) * 0.06 + t.sway.x);
    ctx.strokeStyle = '#3f8f4c';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(4, -18, 0, -36);
    ctx.stroke();
    ctx.fillStyle = '#4fae5c';
    ctx.beginPath();
    ctx.ellipse(-8, -12, 10, 4, -0.7, 0, TAU);
    ctx.fill();
    ctx.translate(0, -40);
    ctx.scale(1 - t.pop.x * 0.15, 1 + t.pop.x * 0.3);
    ctx.fillStyle = t.color;
    ctx.strokeStyle = 'rgba(60, 10, 30, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-10, -12);
    ctx.lineTo(-4, -6);
    ctx.lineTo(0, -14);
    ctx.lineTo(4, -6);
    ctx.lineTo(10, -12);
    ctx.quadraticCurveTo(11, 4, 0, 6);
    ctx.quadraticCurveTo(-11, 4, -10, -12);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

function drawShadows() {
  ctx.fillStyle = '#0b1a10';
  for (const s of stones) {
    if (s.y > GROUND_Y) continue;
    const h = clamp(s.y / GROUND_Y, 0, 1);
    const rx = s.r * (0.5 + 0.8 * h);
    ctx.globalAlpha = 0.1 + 0.35 * h * h;
    ctx.beginPath();
    ctx.ellipse(s.x, GROUND_Y + 8, rx, rx * 0.32, 0, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function bristlePath(half, hgt, lag) {
  ctx.beginPath();
  ctx.moveTo(-BASE_HALF, 2);
  ctx.lineTo(-half + lag, -hgt + 6);
  ctx.quadraticCurveTo(lag, -hgt - 8, half + lag, -hgt + 6);
  ctx.lineTo(BASE_HALF, 2);
  ctx.closePath();
}

function drawBroom() {
  const b = broom;
  const speed = Math.abs(b.v);
  // Afterimages sell the speed of a hard swing.
  if (speed > 700) {
    const k = clamp((speed - 700) / 900, 0, 1);
    ctx.fillStyle = '#fff1bf';
    b.history.forEach((h, i) => {
      ctx.save();
      ctx.translate(h.x, BROOM_Y);
      ctx.rotate(h.tilt);
      ctx.globalAlpha = ((i + 1) / (b.history.length + 1)) * 0.22 * k;
      bristlePath(TIP_HALF, BRISTLE_H, 0);
      ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(b.x, BROOM_Y + b.recoil.x);
  ctx.rotate(b.tilt.x);

  ctx.fillStyle = handleGrad;
  ctx.beginPath();
  ctx.roundRect(-5, 8, 10, 280, 5);
  ctx.fill();

  const sq = b.squash.x;
  const hgt = BRISTLE_H * (1 - sq);
  const half = TIP_HALF * (1 + sq * 0.55);
  const lag = b.lag.x;
  ctx.fillStyle = strawGrad;
  bristlePath(half, hgt, lag);
  ctx.fill();

  ctx.lineCap = 'round';
  ctx.lineWidth = 1.3;
  for (const dark of [true, false]) {
    ctx.strokeStyle = dark ? 'rgba(130, 85, 25, 0.55)' : 'rgba(255, 240, 190, 0.6)';
    ctx.beginPath();
    for (const s of STRANDS) {
      if (s.dark !== dark) continue;
      ctx.moveTo(s.u * BASE_HALF * 0.9, 2);
      ctx.lineTo(s.u * half * 0.96 + lag, -hgt * s.len + 4 + Math.abs(s.u) * 6);
    }
    ctx.stroke();
  }

  if (b.flash > 0) {
    ctx.globalAlpha = b.flash / 0.08;
    ctx.fillStyle = '#ffffff';
    bristlePath(half, hgt, lag);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = '#b8434a';
  ctx.beginPath();
  ctx.roundRect(-BASE_HALF - 3, -2, (BASE_HALF + 3) * 2, 13, 4);
  ctx.fill();
  ctx.strokeStyle = '#7a2530';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-BASE_HALF - 3, 4.5);
  ctx.lineTo(BASE_HALF + 3, 4.5);
  ctx.stroke();
  ctx.restore();
}

function drawStone(s) {
  const spr = stoneSprites[s.size][s.variant];
  ctx.save();
  ctx.translate(s.x, s.y);
  // Hit squash along the impact normal, eased back with overshoot.
  if (s.squashT < SQUASH_DUR) {
    const a = s.squashAmt * (1 - easeOutBack(s.squashT / SQUASH_DUR));
    ctx.rotate(s.squashAngle);
    ctx.scale(1 - a, 1 + a);
    ctx.rotate(-s.squashAngle);
  }
  // Stretch along velocity, volume preserved.
  const st = 1 + Math.min(Math.hypot(s.vx, s.vy) / 3000, 0.28);
  const va = Math.atan2(s.vy, s.vx);
  ctx.rotate(va);
  ctx.scale(st, 1 / st);
  ctx.rotate(-va);
  ctx.save();
  ctx.rotate(s.rot);
  ctx.drawImage(spr.canvas, -spr.size / 2, -spr.size / 2, spr.size, spr.size);
  ctx.restore();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.ellipse(-s.r * 0.35, -s.r * 0.4, s.r * 0.28, s.r * 0.18, -0.6, 0, TAU);
  ctx.fill();
  if (s.flash > 0) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, s.r * 1.08, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function cloudPath(dx, dy, scale, bumpScale) {
  ctx.beginPath();
  for (const c of clouds) {
    const x = c.x + dx;
    const y = c.y + dy + c.bump.x * bumpScale;
    ctx.moveTo(x + c.r * scale, y);
    ctx.arc(x, y, c.r * scale, 0, TAU);
  }
}

function drawClouds() {
  ctx.fillStyle = '#1d2042';
  ctx.fillRect(-80, -80, W + 160, 100);
  cloudPath(0, -10, 1.05, 0.6);
  ctx.fill();
  ctx.fillStyle = '#2c3060';
  cloudPath(14, 6, 0.82, 1);
  ctx.fill();
  if (cloudGlow > 0) {
    ctx.globalAlpha = cloudGlow * 0.45;
    ctx.fillStyle = '#9cbcff';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    if (!p.alive) continue;
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = p.color;
    switch (p.kind) {
      case P_SHARD:
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(p.size * 0.7, p.size * 0.6);
        ctx.lineTo(-p.size * 0.7, p.size * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      case P_SPARK:
        ctx.lineWidth = p.size * a + 0.5;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        ctx.stroke();
        break;
      case P_MIST:
        ctx.globalAlpha = a * 0.35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (1 - a) * 1.6), 0, TAU);
        ctx.fill();
        break;
      case P_PETAL:
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
        break;
      case P_STAR: {
        const s = p.size * (0.6 + 0.4 * Math.sin(p.life * 30));
        ctx.fillRect(p.x - s, p.y - s * 0.22, s * 2, s * 0.44);
        ctx.fillRect(p.x - s * 0.22, p.y - s, s * 0.44, s * 2);
        break;
      }
      case P_RING: {
        const k = easeOutCubic(1 - a);
        ctx.lineWidth = 1 + 4 * a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (p.grow - 1) * k), 0, TAU);
        ctx.stroke();
        break;
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Chevrons under the clouds warn where hail is about to drop.
function drawWarnings() {
  ctx.strokeStyle = '#ffe9a8';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const s of stones) {
    if (s.y > 50 || s.vy <= 0 || s.hits > 0) continue;
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(time * 18);
    const w = 5 + s.size * 2;
    ctx.beginPath();
    ctx.moveTo(s.x - w, 80);
    ctx.lineTo(s.x, 80 + w * 0.8);
    ctx.lineTo(s.x + w, 80);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function outlinedText(text, x, y, color) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(10, 12, 30, 0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of popups) {
    const k = p.t / p.life;
    const rise = easeOutCubic(Math.min(1, k * 1.4)) * 44;
    const pop = p.t < 0.2 ? 0.3 + 0.7 * easeOutBack(p.t / 0.2) : 1;
    ctx.globalAlpha = k > 0.65 ? 1 - (k - 0.65) / 0.35 : 1;
    ctx.save();
    ctx.translate(p.x + p.drift * k, p.y - rise);
    ctx.scale(pop, pop);
    ctx.font = `900 ${p.size}px ${FONT}`;
    outlinedText(p.text, 0, 0, p.color);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  if (state === 'attract') return;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.save();
  const sp = 1 + 0.32 * scorePop * scorePop;
  ctx.translate(22, 56);
  ctx.scale(sp, sp);
  ctx.font = `900 40px ${FONT}`;
  outlinedText(fmt(score), 0, 0, '#ffffff');
  ctx.restore();
  ctx.font = `800 13px ${FONT}`;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.fillText(`BEST ${fmt(Math.max(best, score))}`, 24, 78);

  if (combo >= 2) {
    const mult = multiplier();
    const cp = 1 + 0.4 * comboPop * comboPop;
    ctx.save();
    ctx.translate(W - 22, 52);
    ctx.scale(cp, cp);
    ctx.textAlign = 'right';
    ctx.font = `900 32px ${FONT}`;
    outlinedText(`×${mult}`, 0, 0, mult >= 4 ? '#ff9a5c' : mult >= 2 ? '#ffd36b' : '#ffffff');
    ctx.restore();
    ctx.textAlign = 'right';
    ctx.font = `800 13px ${FONT}`;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.fillText(`${combo} COMBO`, W - 24, 76);
  }
}

function render() {
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  // Camera: trauma squared shake, a downward kick, and a zoom punch. Visual only, never the simulation.
  const m = shakeLevel();
  const s = trauma * trauma * m;
  const ox = MAX_SHAKE_X * s * wobble(shakeClock, 0.3);
  const oy = MAX_SHAKE_Y * s * wobble(shakeClock, 2.1) + kickY * m;
  const roll = MAX_ROLL * s * wobble(shakeClock, 4.7);
  const z = 1 + zoom * m;
  ctx.save();
  ctx.translate(W / 2 + ox, H / 2 + oy);
  ctx.rotate(roll);
  ctx.scale(z, z);
  ctx.translate(-W / 2, -H / 2);
  drawSky();
  drawRain();
  drawGround();
  drawTulips();
  drawShadows();
  drawBroom();
  for (const st of stones) drawStone(st);
  drawClouds();
  drawParticles();
  drawWarnings();
  drawPopups();
  ctx.restore();

  if (flashA > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashA})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (missA > 0) {
    ctx.globalAlpha = missA * (settings.flashes ? 1 : 0.6);
    ctx.fillStyle = missGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);
  drawHud();
}

// ---------- loop ----------
let lastTime = performance.now();
function frame(now) {
  const realDt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;

  trauma = Math.max(0, trauma - TRAUMA_DECAY * realDt);
  shakeClock += realDt;
  zoom *= Math.exp(-8 * realDt);
  kickY *= Math.exp(-14 * realDt);
  flashA = Math.max(0, flashA - realDt * 3.5);
  missA = Math.max(0, missA - realDt * 1.6);
  lightning = Math.max(0, lightning - realDt);
  cloudGlow = Math.max(0, cloudGlow - realDt * 1.5);
  scorePop = Math.max(0, scorePop - realDt * 4);
  comboPop = Math.max(0, comboPop - realDt * 4);

  // Hit-stop and slow motion count down on real time, so the world always resumes.
  let timeScale = 1;
  if (hitStop > 0) { hitStop -= realDt; timeScale = HITSTOP_SCALE; }
  if (slowmo > 0) {
    slowmo = Math.max(0, slowmo - realDt);
    const k = 1 - slowmo / SLOWMO_DUR;
    timeScale = Math.min(timeScale, 0.15 + 0.85 * k * k);
  }
  if (state !== 'paused') {
    step(realDt * timeScale);
    recordBroomPose();
  }
  if (state === 'over') {
    overTimer += realDt;
    if (overTimer > 1.15) {
      state = 'attract';
      showMenu('over');
      if (newBest) sfx.best();
    }
  }
  render();
  requestAnimationFrame(frame);
}

// ---------- menu ----------
const menu = document.getElementById('menu');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const playBtn = document.getElementById('play');
const shakeBtn = document.getElementById('shake');
const flashBtn = document.getElementById('flashes');
const soundBtn = document.getElementById('sound');

function showMenu(mode) {
  menuMode = mode;
  playBtn.textContent = mode === 'paused' ? 'Resume' : mode === 'over' ? 'Play again' : 'Play';
  statusEl.textContent = mode === 'paused' ? 'Paused.' : mode === 'over' ? 'The garden is flattened.' : 'Bat the hail back into the sky. Keep the tulips alive.';
  if (mode === 'over') {
    resultEl.textContent = newBest ? `New best: ${fmt(score)}!` : `Score ${fmt(score)}. Best ${fmt(best)}.`;
    resultEl.hidden = false;
  } else if (mode === 'start' && best > 0) {
    resultEl.textContent = `Best ${fmt(best)}`;
    resultEl.hidden = false;
  } else {
    resultEl.hidden = true;
  }
  menu.inert = false;
  menu.classList.add('show');
  document.body.classList.remove('playing');
  playBtn.focus({ preventScroll: true });
}

function hideMenu() {
  menu.classList.remove('show');
  menu.inert = true;
  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  document.body.classList.add('playing');
}

function renderSettings() {
  shakeBtn.textContent = SHAKE_LABELS[settings.shake];
  flashBtn.textContent = settings.flashes ? 'Flashes on' : 'Flashes off';
  soundBtn.textContent = settings.sound ? 'Sound on' : 'Sound off';
  writeStore('hailbroom.settings', settings);
}

function toggleSound() {
  settings.sound = !settings.sound;
  renderSettings();
}

playBtn.addEventListener('click', primaryAction);
shakeBtn.addEventListener('click', () => {
  settings.shake = (settings.shake + 1) % SHAKE_LEVELS.length;
  renderSettings();
  addTrauma(0.6); // preview the new level
});
flashBtn.addEventListener('click', () => { settings.flashes = !settings.flashes; renderSettings(); });
soundBtn.addEventListener('click', () => { toggleSound(); sfx.unlock(); sfx.start(); });

// ---------- input ----------
const pointerToWorldX = (e) => {
  const rect = canvas.getBoundingClientRect();
  return clamp(((e.clientX - rect.left) / rect.width) * W, BROOM_MIN_X, BROOM_MAX_X);
};
window.addEventListener('pointermove', (e) => {
  broom.targetX = pointerToWorldX(e);
  inputMode = 'pointer';
});
window.addEventListener('pointerdown', (e) => {
  sfx.unlock();
  if (e.target === canvas) {
    broom.targetX = pointerToWorldX(e);
    inputMode = 'pointer';
  }
});
window.addEventListener('keydown', (e) => {
  sfx.unlock();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
  else if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'playing') pause();
    else if (state === 'paused') resume();
  } else if (k === 'm' || k === 'M') toggleSound();
  else if ((k === ' ' || k === 'Enter') && !(e.target instanceof HTMLButtonElement)) {
    e.preventDefault();
    if (state === 'attract' || state === 'paused') primaryAction();
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', resize);

resize();
renderSettings();
showMenu('start');
requestAnimationFrame(frame);
</script>
</body>
</html>
